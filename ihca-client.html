<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>IHCA 團隊復甦</title>
<style>
:root{--bg:#0A0F14;--card:#141C24;--line:#26333F;--ink:#DCE6EE;--dim:#8296A8;
 --ecg:#25E06B;--co2:#F5C542;--cy:#3FD0E8;--rd:#FF5566;--gold:#E8B84B;
 --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
 overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column}
button{font-family:var(--sans);font-size:14px;color:var(--ink);background:#1F2C38;border:1px solid #384956;
 border-radius:10px;padding:10px 8px;cursor:pointer;min-width:0;min-height:54px;font-weight:500;
 display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
button:active{background:#2C3D4C}
button.sent{animation:sentPulse .45s ease-out}
@keyframes sentPulse{0%{filter:brightness(1.75)}100%{filter:brightness(1)}}
button:disabled{opacity:.28}
button.hot{background:#8A2530;border-color:#C0454F;color:#fff}
button.go{background:#1B5E45;border-color:#2E8A67}
button.warn{background:#8A6417;border-color:#C09A2E;color:#fff}
button.lead{background:#6B4C0E;border-color:#D6AC3A;color:#fff}
button.talk{background:#173845;border-color:#2F6C82}
button.wide{grid-column:1 / -1}
button.ghost{font-size:12px;padding:8px 10px;min-height:42px;background:#161F27}

/* ── 監視器 ── */
#mon{flex:none;background:#000;border-bottom:1px solid var(--line);display:flex;height:66px}
body.mode-host #mon{height:112px}
.mch{flex:1;position:relative;min-width:0;border-right:1px solid #141C24;padding:3px 0 0 8px}
.mch:last-child{border-right:none}
.mch .k{font-family:var(--mono);font-size:10px;letter-spacing:.05em}
body.mode-host .mch .k{font-size:14px}
.mch .v{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1;margin-top:1px}
body.mode-host .mch .v{font-size:40px}
.mch canvas{position:absolute;left:0;bottom:1px;width:100%;height:38px}
body.mode-host .mch canvas{height:66px}
#alm{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-family:var(--mono);font-size:11px;color:var(--rd);text-align:center;line-height:1.25;gap:3px}
body.mode-host #alm{width:96px;font-size:19px}
#alm .sub{font-size:8.5px;color:var(--dim);letter-spacing:.04em}
body.mode-host #alm .sub{font-size:12px}

/* ── 場地 ── */
#field{flex:1;position:relative;min-height:0;background:#0D1319}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:9px;top:6px;font-family:var(--mono);pointer-events:none;z-index:3}
#hud .t{font-size:21px;font-weight:500;color:#EAF2F8;line-height:1;text-shadow:0 2px 8px #000}
#hud .s{font-size:10px;color:#9FB2C2;margin-top:3px;text-shadow:0 1px 4px #000}
body.mode-host #hud .t{font-size:30px}body.mode-host #hud .s{font-size:13px}
#ord{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:6;
 background:rgba(150,118,30,.97);color:#fff;padding:9px 13px;border-radius:11px;
 display:none;align-items:center;gap:10px;max-width:92%;box-shadow:0 5px 18px rgba(0,0,0,.45)}
#ord.on{display:flex}
#ord .x{flex:1;font-size:15px;font-weight:700;line-height:1.35}
body.mode-host #ord .x{font-size:26px}
#ord button{flex:0 0 auto;min-width:0;min-height:0;font-size:12px;padding:8px 12px;
 background:#12301F;border-color:#2E8A67;border-radius:8px}
#feed{position:absolute;right:6px;top:54px;bottom:8px;width:40%;max-width:230px;z-index:4;
 display:flex;flex-direction:column;gap:5px;pointer-events:none;overflow:hidden;justify-content:flex-end}
body.mode-host #feed{max-width:400px;width:31%}
#feed .f{background:rgba(10,18,26,.86);border-left:3px solid #3FD0E8;border-radius:7px;
 padding:5px 8px;font-size:12px;line-height:1.4;color:#D6E2EC}
body.mode-host #feed .f{font-size:23px;padding:11px 15px;line-height:1.45}
/* ── 紀錄表（只在投影幕左側）──
   內容全部是「已經發生過的事」，所以全隊都看得到也不會洩漏現在幾分幾秒。 */
#recbox{display:none}
body.mode-host #recbox{display:block;position:absolute;left:8px;top:54px;bottom:8px;
  width:31%;max-width:430px;z-index:4;pointer-events:none;overflow:hidden}
#recbox table{width:100%;border-collapse:collapse;background:rgba(10,18,26,.88);
  border-radius:9px;overflow:hidden;font-size:16px}
#recbox th{background:rgba(63,208,232,.16);color:#8FE3F5;font-weight:600;
  padding:6px 8px;text-align:left;font-size:15px;letter-spacing:.5px}
#recbox td{padding:6px 8px;border-top:1px solid rgba(255,255,255,.07);
  color:#EAF2F8;vertical-align:top;line-height:1.35}
#recbox td.t{font-family:var(--mono);color:#8FE3F5;white-space:nowrap}
#recbox td.e{color:#3A4652}
#recbox .cap{color:#8296A8;font-size:14px;padding:4px 2px 6px}
#feed .f.new{animation:slideIn .3s ease-out}
#feed .f b{font-weight:700;margin-right:5px}
#feed .f.big{background:rgba(22,80,100,.93);font-size:13px;border-left-color:#8FE3F5}
body.mode-host #feed .f.big{font-size:27px}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
/* ── 直立手機的訊息列 ──
   桌機／橫向時 #field 被 44vh 限高，畫布左右留黑邊，訊息疊在黑邊上不礙事。
   直立手機的 #field 剛好等於病房比例、沒有黑邊，40% 寬的訊息會直接蓋掉
   床右、電擊器與家屬那一側 —— 所以改成放在病房畫面下方，完全不重疊。 */
#feedp{display:none}
@media (max-width:640px){
  body.mode-player #feed{display:none}
  body.mode-player #toast{top:4px;bottom:auto;font-size:12.5px;max-width:94%}
  body.mode-player #feedp{display:flex;flex:none;flex-direction:column;
    gap:4px;padding:5px 7px;background:#0B1219;border-top:1px solid var(--line)}
  body.mode-player #feedp:empty{display:none}
  #feedp .f{background:rgba(18,30,40,.92);border-left:3px solid #3FD0E8;border-radius:7px;
    padding:4px 8px;font-size:12px;line-height:1.35;color:#D6E2EC;flex:none;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical}
  #feedp .f b{font-weight:700;margin-right:5px}
  #feedp .f.big{background:rgba(22,80,100,.93);border-left-color:#8FE3F5;font-weight:600}
  #feedp .f.new{animation:slideUp .3s ease-out}
}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tb{position:absolute;top:6px;font-size:11px;padding:7px 9px;min-height:0;min-width:0;
 background:rgba(20,28,36,.92);border:1px solid var(--line);border-radius:8px;flex:none;z-index:5}
#mode{right:8px}#spd{right:88px}#pausebtn{right:158px}
#pausebtn.on{background:#7A4A12;border-color:#C09A2E;color:#fff}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(8,13,18,.95);
 border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;pointer-events:none;
 opacity:0;transition:opacity .2s;max-width:88%;text-align:center;line-height:1.45;z-index:7}
#toast.on{opacity:1}
#toast.priv{border-color:#3D6E80;background:rgba(10,26,34,.96)}
#toast .pv{display:block;font-size:10px;letter-spacing:.1em;color:var(--cy);margin-bottom:2px}
/* 浮動搖桿：手指按在病房畫面的任何地方就會長出來 */
#stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;
 background:rgba(14,26,34,.34);border:2px solid rgba(120,170,195,.45);display:none;
 touch-action:none;pointer-events:none;z-index:5}
#stick.on{display:block}
#knob{position:absolute;left:41px;top:41px;width:46px;height:46px;border-radius:50%;
 background:rgba(120,215,240,.7);border:2px solid rgba(230,248,255,.8);pointer-events:none;
 box-shadow:0 0 14px rgba(63,208,232,.5)}
#field{touch-action:none}
/* 你現在站在哪裡 — 因為學員看的是大螢幕，不會盯著手機 */
#youare{position:sticky;top:0;z-index:2;background:linear-gradient(#141C24,#141C24 78%,rgba(20,28,36,0));
 padding:2px 2px 9px;margin:-2px -2px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#youare .st{font-size:19px;font-weight:700;color:#EAF2F8;letter-spacing:.04em}
#youare .st.on{color:#7FE0A8}
#youare .hd{font-size:12.5px;color:var(--dim)}
#youare .hd b{color:#8FE3F5}
#youare .me{font-size:13px;font-weight:700;padding:2px 9px;border-radius:7px;background:#1D2C38}
#strip{position:absolute;left:8px;right:8px;top:44px;z-index:8;display:none;
 background:rgba(4,10,14,.96);border:1px solid #2E4450;border-radius:12px;padding:8px 10px 6px;
 box-shadow:0 8px 30px rgba(0,0,0,.6)}
#strip.on{display:block}
#strip .sl{display:flex;justify-content:space-between;align-items:baseline;
 font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:3px}
#strip .sl b{color:#EAF2F8;font-size:13px;letter-spacing:.05em}
body.mode-host #strip .sl b{font-size:22px}
#strip .sl .cd{color:var(--gold)}
#cStrip{width:100%;height:104px;display:block}
body.mode-host #cStrip{height:190px}
#strip .sn{font-size:11px;color:#7C8F9F;margin-top:3px;line-height:1.5}
body.mode-host #strip .sn{font-size:16px}

/* ── 角色列（單機／主機） ── */
#who{flex:none;display:flex;gap:4px;padding:5px 6px;background:#0E151C;border-top:1px solid var(--line);height:54px}
body.mode-host #who{height:82px}
#who .w{flex:1;min-width:0;border:1px solid #2B3945;border-radius:9px;padding:5px 3px;text-align:center;
 background:#151E27;cursor:pointer;position:relative}
#who .w.sel{border-color:var(--cy);background:#1D2C38}
#who .w.ld{box-shadow:inset 0 0 0 1px var(--gold)}
#who .w.off{opacity:.4}
#who .w .n{font-size:14px;font-weight:700;line-height:1.15}
body.mode-host #who .w .n{font-size:26px}
#who .w .b{font-size:9px;color:var(--dim);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mode-host #who .w .b{font-size:14px}
#who .w .d{position:absolute;left:50%;transform:translateX(-50%);top:2px;width:5px;height:5px;border-radius:50%}
#who .w .cr{position:absolute;right:3px;top:1px;font-size:9px;color:var(--gold)}

/* ── 動作面板 ── */
#panel{flex:none;background:var(--card);border-top:1px solid var(--line);
 padding:7px 9px calc(7px + env(safe-area-inset-bottom));
 height:250px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
.sec{grid-column:1 / -1;display:flex;align-items:center;gap:9px;margin:9px 0 1px;
 font-size:10px;letter-spacing:.16em;color:var(--dim)}
.sec:first-child{margin-top:0}
.sec i{flex:1;height:1px;background:#26333F;display:block}
.sec.t1{color:#7FE0A8}.sec.t2{color:#6FC8DE}.sec.t3{color:#6C7E8C}
.held{grid-column:1 / -1;background:#16232E;border:1px solid #2C4150;border-radius:8px;
 padding:7px 10px;font-size:13px;color:#A8BECE}
.held b{color:#EAF2F8}
.hint{color:var(--dim);font-size:12.5px;padding:3px 2px;line-height:1.5;grid-column:1 / -1}
/* 通氣節拍（A8：插管後不再自動給氣，床頭要看得到節奏） */
.metro{position:relative;height:26px;border-radius:7px;background:rgba(255,255,255,.07);
  overflow:hidden;margin:2px 0 4px}
.metro i{position:absolute;left:0;top:0;bottom:0;background:rgba(76,175,110,.42);
  transition:width .12s linear}
.metro.due i{background:rgba(224,85,85,.55)}
.metro b{position:relative;display:block;line-height:26px;text-align:center;
  font-size:12.5px;color:#fff;letter-spacing:.4px}
.metro.due b{animation:mblink .7s steps(2,end) infinite}
@keyframes mblink{50%{opacity:.35}}
/* 下 order 指定對象用的頭像色塊 */
.who .dot{display:inline-block;width:13px;height:13px;border-radius:50%;
  margin-right:7px;vertical-align:-2px;box-shadow:0 0 0 2px rgba(0,0,0,.28)}
.bad{color:#FF8A93}.good{color:#6FE0A6}
.cnt{grid-column:1 / -1;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.cnt b{font-family:var(--mono);font-size:30px;line-height:1;color:#FFF}
.fat{flex:1;height:8px;background:#0E151B;border-radius:4px;overflow:hidden}
.fat i{display:block;height:100%}
.cl{border-left:3px solid var(--cy);padding:5px 0 5px 10px;margin:0 0 9px;font-size:13.5px;line-height:1.55;grid-column:1 / -1}
.cl b{display:block;font-size:10.5px;color:var(--cy);margin-bottom:2px;font-weight:500}

/* ── 進場 / 大廳 ── */
#gate{position:fixed;inset:0;background:#0A0F14;z-index:30;overflow-y:auto;touch-action:pan-y;
 padding:26px 18px 40px;display:none}
#gate.on{display:block}
#gate .inner{max-width:520px;margin:0 auto}
#gate h1{font-size:22px;font-weight:500;margin:0 0 6px;letter-spacing:.02em}
#gate p{color:var(--dim);font-size:13.5px;line-height:1.65;margin:0 0 14px}
#gate .lab{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:20px 0 8px}
#nameIn{width:100%;font-size:44px;text-align:center;padding:14px;border-radius:14px;
 background:#141C24;border:1px solid #34485A;color:#fff;font-family:var(--sans);letter-spacing:.3em}
#nameIn:focus{outline:2px solid var(--cy)}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#slots button{min-height:76px;flex-direction:column;gap:4px;font-size:12px}
#slots button .dot{width:22px;height:22px;border-radius:50%}
#slots button.taken{opacity:.42}
#slots button.on{border-color:var(--cy);background:#1D3543}
.big-url{font-family:var(--mono);font-size:clamp(20px,5vw,44px);color:#8FE3F5;
 background:#0E1A22;border:1px solid #26414F;border-radius:14px;padding:16px;text-align:center;
 word-break:break-all;line-height:1.35}

/* ── 教師控制台 ── */
#tc{position:fixed;inset:0;background:#080D11;z-index:12;overflow-y:auto;touch-action:pan-y;
 padding:16px 16px 40px;display:none}
#tc.on{display:block}
#tc .inner{max-width:620px;margin:0 auto}
#tc h2{font-size:17px;font-weight:500;margin:22px 0 8px;color:#CFDCE6}
#tc h2:first-child{margin-top:0}
#tc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tc .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#tc .g button,#tc .g3 button{min-height:52px;font-size:13.5px;flex-direction:column;gap:2px}
#tc button.on{border-color:var(--cy);background:#1D3543;color:#fff}
#tc .note{font-size:12px;color:var(--dim);line-height:1.6;margin:8px 0 0}
#tc .roster{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
#tc .roster div{background:#141C24;border:1px solid #26333F;border-radius:9px;padding:8px 4px;
 text-align:center;font-size:20px;font-weight:700}
#tc .roster div small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:3px}
#tc .roster div.off{opacity:.35}

/* ── 報表 ── */
#sheet{position:fixed;inset:0;background:#060A0E;z-index:18;padding:18px 16px 40px;
 overflow:auto;display:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#sheet.on{display:block}
#sheet .inner{max-width:620px;margin:0 auto}
#sheet h3{margin:0 0 4px;font-size:22px;font-weight:500;text-align:center}
#sheet .sub{margin:0 0 16px;color:var(--dim);font-size:13px;text-align:center}
#sheet h4{font-size:11px;letter-spacing:.14em;color:var(--cy);margin:22px 0 6px;font-weight:500;
 border-bottom:1px solid #1B2A33;padding-bottom:5px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #16202A;font-size:13.5px;gap:14px}
.row span:first-child{color:var(--dim)}
.row span:last-child{font-family:var(--mono);color:#EAF2F8;text-align:right;white-space:pre-line}
.row.ok span:last-child{color:#6FE0A6}
.row.warn span:last-child{color:#E8B84A}
table.drill{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0}
table.drill th,table.drill td{border:1px solid rgba(255,255,255,.10);padding:5px 6px;text-align:center}
table.drill th{color:var(--dim);font-weight:500;font-size:11.5px;line-height:1.3}
table.drill td:first-child,table.drill th:first-child{text-align:left;white-space:nowrap}
table.drill td{color:#4A5560}
table.drill td.done{color:#6FE0A6;font-weight:700}
table.drill .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.row.no span:last-child{color:#FF8A93}
.tlr{display:flex;gap:9px;font-size:12.5px;line-height:1.55;padding:2.5px 0;color:#B9C9D6}
.tlr .tt{font-family:var(--mono);color:#5F7183;flex:none;width:44px}
.tlr.key{color:#EAF2F8}.tlr.key .tt{color:var(--cy)}
.talkr{display:flex;gap:8px;font-size:12.5px;line-height:1.6;padding:2.5px 0;color:#B9C9D6}
.talkr .tt{font-family:var(--mono);color:#5F7183;flex:none;width:44px}
.talkr b{flex:none;margin-right:2px}
#swim{width:100%;display:block;border-radius:8px;background:#080E12;border:1px solid #1B2A33}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin:8px 0 0;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
#sheet .btns button{min-height:48px;font-size:13.5px}

/* ── 重播列 ── */
#rp{flex:none;background:#0E151C;border-top:1px solid var(--line);padding:8px 12px 12px;display:none}
body.mode-replay #rp{display:block}
#rp .r1{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#rp .r1 button{min-height:40px;padding:6px 12px;font-size:13px}
#rp .tm{font-family:var(--mono);font-size:15px;color:#EAF2F8;min-width:96px}
#rp input[type=range]{width:100%;accent-color:#3FD0E8}
#rp .r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
#rp .r2 button{min-height:34px;padding:5px 10px;font-size:12px}
#rp .r2 button.on{border-color:var(--cy);background:#1D3543;color:#fff}

body.mode-player #who{display:none}
body.mode-host #hud{display:none}   /* 投影幕不顯示急救經過時間 —— 那是紀錄者的資訊 */
body.mode-player #field{flex:0 0 auto;aspect-ratio:900/780;max-height:44vh}
body.mode-player #toast{top:auto;bottom:8px}
body.mode-player #panel{flex:1;height:auto;min-height:0}
body.mode-host #panel,body.mode-host #stick,body.mode-host .tb{display:none}
body.mode-teacher #panel,body.mode-teacher #who{display:none}
body.mode-replay #panel{display:none}
</style>
<body>
<div id="app">
 <div id="mon">
  <div id="alm">ASYS<span class="sub"></span></div>
  <div class="mch"><div class="k" style="color:var(--ecg)">II</div><div class="v" id="vHR" style="color:var(--ecg)">‑‑</div><canvas id="cEcg"></canvas></div>
  <div class="mch"><div class="k" style="color:var(--co2)">EtCO₂</div><div class="v" id="vCo" style="color:var(--co2)">‑‑</div><canvas id="cCo2"></canvas></div>
  <div class="mch"><div class="k" style="color:var(--cy)">SpO₂</div><div class="v" id="vSp" style="color:var(--cy)">‑‑</div></div>
  <div class="mch"><div class="k" style="color:var(--rd)">NIBP</div><div class="v" id="vBP" style="color:var(--rd);font-size:13px;margin-top:6px">未測量</div></div>
 </div>
 <div id="field">

    <div class="sl"><b id="stripT">心律判讀</b><span class="cd" id="stripC"></span></div>
    <canvas id="cStrip"></canvas>

 </div>

 <div id="panel"><div id="youare"></div><div id="acts"></div></div>
 <div id="rp">
   <div class="r1">
     <button id="rpPlay">▶</button>
     <span class="tm" id="rpTime">00:00 / 00:00</span>
     <input type="range" id="rpSeek" min="0" max="1000" value="0">
   </div>
   <div class="r2">
     <span>速度</span>
     <button class="rpS" data-v="1">1×</button><button class="rpS on" data-v="2">2×</button>
     <button class="rpS" data-v="4">4×</button><button class="rpS" data-v="8">8×</button>
     <span style="margin-left:10px">視角</span><span id="rpEyes"></span>

<script src="ihca-sim.js"></script>
<script src="qr.js"></script>
<script>
'use strict';
const K=IHCA.K, RH=IHCA.RH, mmt=IHCA.mmt;
const $=id=>document.getElementById(id);
const QS=new URLSearchParams(location.search);
const isFile=location.protocol==='file:';
let MODE=QS.get('m')||(isFile?'solo':'player');
if(MODE==='replay'&&!isFile){}
document.body.className='mode-'+MODE;

/* 這台裝置操作的角色（多人版＝自己；單機版＝目前選到的人） */
let ME=null;
let G=null;                      /* 要畫的狀態 */
let LOBBY=null;
let sub=null, mode='tap', speed=1, toastT=0, jact=false;
let orderTxt='', orderGrp=0, recF={}, recFld='rhythm';
const _confirm={};
let ettScope='Direct', ettBlade='3 號';
let SOLO=(MODE==='solo'), REPLAY=(MODE==='replay');
let ROOM=QS.get('r')||localStorage.getItem('ihcaRoom')||'';
let TKEY=QS.get('k')||'';
let DENIED=null;
const studentURL=()=>location.origin+location.pathname.replace(/[^/]*$/,'')+'?r='+ROOM;
function qrSVG(text,px){try{return QR.svg(text,px||6,'#0A0F14','#FFFFFF');}
  catch(e){return '<div style="color:#FF8A93">QR 產生失敗</div>';}}

/* ═══════════ 網路 ═══════════ */
const NET={ws:null,ok:false,queue:[],
  connect(){
    if(isFile||SOLO||REPLAY)return;
    const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
    const ws=new WebSocket(url);NET.ws=ws;
    ws.onopen=()=>{NET.ok=true;NET.hello();};
    ws.onclose=()=>{NET.ok=false;setTimeout(NET.connect,1500);};
    ws.onerror=()=>{};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}NET.recv(m);};
  },
  hello(){
    if(MODE==='host'||MODE==='teacher'){NET.send({t:'hello',role:MODE,key:TKEY});return;}
    if(!ROOM){DENIED='room';paintGate();return;}
    const nm=localStorage.getItem('ihcaName')||'';
    if(!nm){NET.send({t:'hello',role:'lobby',room:ROOM});return;}  /* 還沒填名字＝先不要佔位子 */
    NET.send({t:'hello',role:'player',name:nm,slot:localStorage.getItem('ihcaSlot')||'',room:ROOM});
  },
  send(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));},
  act(a,p){if(SOLO||REPLAY){soloAct(a,p);return;}NET.send({t:'act',act:a,p:p||{}});},
  recv(m){
    if(m.t==='welcome'){ME=m.slot;DENIED=null;PRED.init=0;PRED.vx=PRED.vy=0;_lastGate='';
      if(m.room){ROOM=m.room;localStorage.setItem('ihcaRoom',m.room);}
      if(m.key)TKEY=m.key;
      if(ME)localStorage.setItem('ihcaSlot',ME);}
    else if(m.t==='denied'){DENIED=m.need;ME=null;_lastGate='';paintGate();}
    else if(m.t==='snap'){
      if(G&&G.over&&!m.s.over){HIST=null;_askedHist=0;$('sheet').classList.remove('on');}
      G=m.s;afterSnap();}
    else if(m.t==='lobby'){LOBBY=m;paintGate();paintTC();}
    else if(m.t==='log'){for(const e of m.e)toast(e.m,e.p);}
    else if(m.t==='history'){HIST=m.h;renderSheet();}
    else if(m.t==='recording'){downloadRec(m.rec);}
    else if(m.t==='full'){alert('六個位子都滿了。');}
  }};
let HIST=null;

/* ═══════════ 單機／重播用的本地模擬 ═══════════ */
let LOCAL=null, REC=null;
function soloNew(setup){
  const seed=(Math.random()*0xFFFFFFFF)>>>0;
  LOCAL=IHCA.newState(seed,setup||{});
  REC={v:3,seed,setup:setup||{},events:[]};
  G=LOCAL;ME=ME||'a';
}
function soloAct(a,p){
  if(!LOCAL||REPLAY)return;
  if(IHCA.applyAct(LOCAL,ME,a,p))REC.events.push({k:LOCAL.tick,c:ME,a,p:p||null});
  paint();
}
function soloCtl(a,p){
  if(!LOCAL)return;
  if(IHCA.applyAct(LOCAL,null,a,p))REC.events.push({k:LOCAL.tick,c:null,a,p:p||null});
}

/* ═══════════ 通用 ═══════════ */
const C=id=>G&&G.ch.find(c=>c.id===id);
const meC=()=>C(ME);
function nearSt(c){let b=null,d=1e9;for(const k in K.ST){const s=K.ST[k],dd=Math.hypot(c.x-s.x,c.y-s.y-26);
  if(dd<d){d=dd;b=k}}return d<88?b:null;}
function nearEq(c){let b=null,d=1e9;for(const k in G.eq){const e=G.eq[k],dd=Math.hypot(c.x-e.x,c.y-e.y);
  if(dd<d){d=dd;b=k}}return d<112?b:null;}
const atSideC=c=>['bedL','bedR'].includes(nearSt(c));
const compressingG=()=>!!(G&&G.cpr&&!G.pauseVent&&!G.holdCpr&&G.check<=0);
const clearOnG=()=>G&&G.t-G.clearAt<10;
function toast(m,priv){const e=$('toast');
  e.innerHTML=(priv?'<span class="pv">只有你知道</span>':'')+m;
  e.classList.toggle('priv',!!priv);e.classList.add('on');toastT=3.6;}

/* ═══════════ 病房繪圖 ═══════════ */
const BEDC=K.BED;
const _sm={};
function smooth(c,dt){
  let s=_sm[c.id];
  if(!s||Math.hypot(s.x-c.x,s.y-c.y)>260)s=_sm[c.id]={x:c.x,y:c.y};
  const k=Math.min(1,dt*16);s.x+=(c.x-s.x)*k;s.y+=(c.y-s.y)*k;return s;
}
let _rc=null,_rcN=0,_lastFrame=0,ANIM=0;
/* 自己的角色不等伺服器回話，先在本機動起來；收到快照再慢慢校正。
   這是「延遲感」的主要來源 —— 少了它，每一步都要等一個來回。 */
const PRED={init:0,x:0,y:0,vx:0,vy:0};
function predict(c,dt){
  if(!PRED.init){PRED.x=c.x;PRED.y=c.y;PRED.init=1;}
  const spd=(!SOLO&&!REPLAY&&LOBBY&&LOBBY.speed)?LOBBY.speed:1;
  if((PRED.vx||PRED.vy)&&!(G&&G.paused)){
    PRED.x+=PRED.vx*200*dt*spd;PRED.y+=PRED.vy*200*dt*spd;
    const p={x:PRED.x,y:PRED.y};IHCA.collide(p);PRED.x=p.x;PRED.y=p.y;
    const ex=c.x-PRED.x,ey=c.y-PRED.y;
    if(Math.hypot(ex,ey)>90){PRED.x=c.x;PRED.y=c.y;}
    else{const k=Math.min(1,dt*1.8);PRED.x+=ex*k;PRED.y+=ey*k;}
  }else{
    const k=Math.min(1,dt*14);PRED.x+=(c.x-PRED.x)*k;PRED.y+=(c.y-PRED.y)*k;
  }
  return PRED;
}
function drawWard(cx,cv,meId){
  if(!G)return;
  const W=K.W,H=K.H;
  const now=performance.now(),fdt=Math.min(.06,(now-_lastFrame)/1000||.016);_lastFrame=now;
  const LIVE=G.ch.filter(c=>c.active!==false);
  const CH=(SOLO||REPLAY)?LIVE:LIVE.map(c=>{
    if(c.id===ME){const p=predict(c,fdt);return Object.assign({},c,{x:p.x,y:p.y});}
    const s=smooth(c,fdt);return Object.assign({},c,{x:s.x,y:s.y});});
  if(!_rc||++_rcN>30){_rc=cv.getBoundingClientRect();_rcN=0;}
  const r=_rc,dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);}
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,r.width,r.height);
  const sc=Math.min(r.width/W,r.height/H);
  cx.translate((r.width-W*sc)/2,(r.height-H*sc)/2);cx.scale(sc,sc);
  const A=(SOLO||REPLAY)?G.anim:ANIM;   /* 連線版用本機時鐘，動畫才會順 */

  const rr=(x,y,w,h,rad)=>{cx.beginPath();cx.moveTo(x+rad,y);cx.arcTo(x+w,y,x+w,y+h,rad);
    cx.arcTo(x+w,y+h,x,y+h,rad);cx.arcTo(x,y+h,x,y,rad);cx.arcTo(x,y,x+w,y,rad);cx.closePath();};
  const shadow=(x,y,rx)=>{cx.fillStyle='rgba(20,30,40,.18)';cx.beginPath();
    cx.ellipse(x,y,rx,rx*.34,0,0,6.3);cx.fill();};
  const plate=(x,y,txt,bg,fg,fs)=>{fs=fs||14;cx.font='700 '+fs+'px sans-serif';cx.textAlign='center';
    const w=cx.measureText(txt).width+18;cx.fillStyle=bg;rr(x-w/2,y-fs-4,w,fs+10,7);cx.fill();
    cx.fillStyle=fg;cx.fillText(txt,x,y);};

  cx.fillStyle='#E6E3DB';cx.fillRect(0,0,W,H);
  cx.strokeStyle='#D8D4CA';cx.lineWidth=1.5;
  for(let i=0;i<=W;i+=75){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,H);cx.stroke();}
  for(let i=0;i<=H;i+=75){cx.beginPath();cx.moveTo(0,i);cx.lineTo(W,i);cx.stroke();}
  cx.fillStyle='#B9C6CE';cx.fillRect(0,0,W,62);
  cx.fillStyle='#8FB6C9';rr(560,13,236,36,6);cx.fill();
  cx.fillStyle='#A7B6BF';cx.fillRect(0,62,W,6);

  (function(){
    const tot=K.WALL.h*3600+K.WALL.m*60+Math.floor(G.t||0);
    const hh=String(Math.floor(tot/3600)%24).padStart(2,'0');
    const mi=String(Math.floor(tot/60)%60).padStart(2,'0');
    const X=W-58,Y=52;
    cx.fillStyle='#F4F2EC';cx.beginPath();cx.arc(X,Y,26,0,6.3);cx.fill();
    cx.strokeStyle='#8A949C';cx.lineWidth=3;cx.stroke();
    cx.fillStyle='#39434B';cx.font='700 16px sans-serif';cx.textAlign='center';
    cx.fillText(hh+':'+mi,X,Y+6);
    if(G.timeShown>0){
      const t=Math.floor(G.t),m2=String(Math.floor(t/60)).padStart(2,'0'),s2=String(t%60).padStart(2,'0');
      cx.fillStyle='rgba(46,116,146,.92)';rr(560,13,236,36,6);cx.fill();
      cx.fillStyle='#EAF6FA';cx.font='700 19px sans-serif';cx.textAlign='center';
      cx.fillText('急救 '+m2+':'+s2,678,38);}
  })();

  for(const k in K.ST){const s=K.ST[k],ld=k==='foot';
    cx.strokeStyle=ld?'rgba(180,150,60,.62)':'rgba(120,130,135,.28)';
    cx.lineWidth=ld?3:2;cx.setLineDash([9,7]);
    rr(s.x-s.w/2,s.y-s.h/2,s.w,s.h,11);cx.stroke();cx.setLineDash([]);
    let nm=s.n;
    if(ld)nm=G.leader?('床尾 · Leader：'+C(G.leader).n):'床尾 · 還沒有人宣告 Leader';
    plate(s.x,s.y-s.h/2-7,nm,ld?'rgba(150,118,30,.95)':'rgba(228,226,218,.95)',ld?'#fff':'#48535E',13);}

  shadow(BEDC.cx,BEDC.cy+BEDC.h/2+6,BEDC.w/2+12);
  cx.fillStyle='#B9C1C4';rr(BEDC.cx-BEDC.w/2,BEDC.cy-BEDC.h/2+BEDC.h*.5,BEDC.w,BEDC.h*.55,12);cx.fill();
  cx.fillStyle='#F1F3F2';rr(BEDC.cx-BEDC.w/2,BEDC.cy-BEDC.h/2,BEDC.w,BEDC.h,12);cx.fill();
  cx.fillStyle='#DAE2E6';rr(BEDC.cx-56,BEDC.cy-BEDC.h/2+9,112,34,8);cx.fill();
  cx.fillStyle='#E8C9AC';cx.beginPath();cx.arc(BEDC.cx,BEDC.cy-BEDC.h/2+44,19,0,6.3);cx.fill();
  cx.fillStyle='#CBD8DE';rr(BEDC.cx-38,BEDC.cy-BEDC.h/2+68,76,140,34);cx.fill();
  plate(BEDC.cx,BEDC.cy-BEDC.h/2-16,G.patient,'rgba(70,84,96,.92)','#EDF3F7',12);

  const px=BEDC.cx+BEDC.w/2+26, py=BEDC.cy+BEDC.h/2-24;
  shadow(px,py+6,16);
  cx.strokeStyle='#9AA6B0';cx.lineWidth=4;
  cx.beginPath();cx.moveTo(px-14,py+4);cx.lineTo(px+14,py+4);cx.stroke();
  cx.beginPath();cx.moveTo(px,py+4);cx.lineTo(px,py-126);cx.stroke();
  cx.beginPath();cx.moveTo(px-11,py-126);cx.lineTo(px+11,py-126);cx.stroke();
  cx.fillStyle='#8A96A0';cx.beginPath();cx.arc(px-11,py-126,3.5,0,6.3);cx.fill();
  cx.beginPath();cx.arc(px+11,py-126,3.5,0,6.3);cx.fill();
  if(G.iv||G.ivFixed){
    cx.fillStyle=G.ivFixed?'rgba(158,220,244,.96)':'rgba(178,192,202,.75)';
    rr(px+2,py-120,26,44,7);cx.fill();
    cx.fillStyle='rgba(255,255,255,.45)';rr(px+5,py-116,8,30,4);cx.fill();
    if(G.ivFixed){cx.strokeStyle='rgba(130,200,230,.92)';cx.lineWidth=2.5;cx.beginPath();
      cx.moveTo(px+15,py-76);cx.quadraticCurveTo(px+6,py-40,BEDC.cx+28,BEDC.cy+34);cx.stroke();
      plate(px+40,py-128,G.ivRoute||'IV','rgba(30,110,140,.94)','#fff',11);}}

  if(G.air!=='BVM'){const ok=G.air==='ETT',ty=BEDC.cy-BEDC.h/2+44;
    cx.strokeStyle=ok?'#2FB6D8':'#E0555F';cx.lineWidth=8;cx.lineCap='round';
    cx.beginPath();cx.moveTo(BEDC.cx,ty+4);cx.lineTo(BEDC.cx-46,ty-24);cx.stroke();cx.lineCap='butt';
    cx.fillStyle=ok?'#7FD8E8':'#F09098';cx.beginPath();cx.arc(BEDC.cx-52,ty-28,9,0,6.3);cx.fill();
    plate(BEDC.cx-78,ty-46,ok?'已插管':'管路位置不對',
      ok?'rgba(30,130,160,.95)':'rgba(180,50,60,.95)','#fff',12);}

  const on=compressingG();
  const chy=BEDC.cy-6, w=Math.sin(A*11.5), hs=on?1+w*.12:1;
  cx.fillStyle=on?'rgba(242,112,75,.9)':'rgba(140,152,162,.55)';
  rr(BEDC.cx-19*hs,chy-13*hs,17*hs,26*hs,6);cx.fill();
  rr(BEDC.cx+2*hs,chy-13*hs,17*hs,26*hs,6);cx.fill();
  if(on){cx.strokeStyle='rgba(242,112,75,.75)';cx.lineWidth=3.5;cx.beginPath();
    cx.arc(BEDC.cx,chy,30+w*5,0,6.3);cx.stroke();}
  if(G.rosc&&!on){const bb=Math.abs(Math.sin(A*(G.roscHR/60)*3.14));
    cx.strokeStyle='rgba(90,210,140,'+(.35+bb*.5)+')';cx.lineWidth=3;cx.beginPath();
    cx.arc(BEDC.cx,chy,26+bb*8,0,6.3);cx.stroke();}
  plate(BEDC.cx,BEDC.cy+BEDC.h/2-8,
    G.check>0?'心律檢查中 · 全部停手':G.pauseVent?'等通氣 '+G.breaths+'/2':
      G.holdCpr?'等壓胸的人按繼續':on?'壓胸中 '+G.cnt+' 下':
      G.phase==='post'?'ROSC 後照護中':'壓胸停止',
    G.check>0?'rgba(70,86,102,.96)':G.pauseVent?'rgba(196,138,28,.96)':
      G.holdCpr?'rgba(150,110,30,.96)':on?'rgba(214,92,58,.96)':
      G.phase==='post'?'rgba(30,130,90,.96)':'rgba(150,60,66,.96)','#fff',14);
  if(clearOnG()&&!G.over)
    plate(BEDC.cx,BEDC.cy-BEDC.h/2-40,'⚡ CLEAR — 壓胸的人放手','rgba(200,50,58,.97)','#fff',16);

  const ico={
    cart:(x,y,s)=>{cx.fillStyle='rgba(255,255,255,.95)';rr(x-s*.16,y-s*.5,s*.32,s,5);cx.fill();
      rr(x-s*.5,y-s*.16,s,s*.32,5);cx.fill();},
    defib:(x,y,s)=>{cx.fillStyle='rgba(255,255,255,.96)';cx.beginPath();
      cx.moveTo(x+s*.16,y-s*.52);cx.lineTo(x-s*.34,y+s*.08);cx.lineTo(x-s*.04,y+s*.08);
      cx.lineTo(x-s*.16,y+s*.52);cx.lineTo(x+s*.34,y-s*.08);cx.lineTo(x+s*.04,y-s*.08);
      cx.closePath();cx.fill();},
    echo:(x,y,s)=>{cx.fillStyle='rgba(255,255,255,.95)';rr(x-s*.2,y-s*.5,s*.4,s*.5,s*.14);cx.fill();
      cx.beginPath();cx.moveTo(x-s*.3,y);cx.lineTo(x+s*.3,y);cx.lineTo(x+s*.2,y+s*.16);
      cx.lineTo(x-s*.2,y+s*.16);cx.closePath();cx.fill();
      cx.strokeStyle='rgba(255,255,255,.75)';cx.lineWidth=s*.07;
      for(let i=1;i<=2;i++){cx.beginPath();cx.arc(x,y+s*.16,s*.16*i+s*.08,.25,2.89);cx.stroke();}},
    pc:(x,y,s)=>{cx.fillStyle='rgba(255,255,255,.94)';rr(x-s*.42,y-s*.4,s*.84,s*.56,5);cx.fill();
      cx.fillStyle='rgba(90,102,114,.95)';rr(x-s*.36,y-s*.34,s*.72,s*.44,3);cx.fill();
      cx.fillStyle='rgba(255,255,255,.94)';rr(x-s*.2,y+s*.18,s*.4,s*.1,3);cx.fill();}};
  for(const k in G.eq){const e=G.eq[k];
    shadow(e.x,e.y+e.h/2+4,e.w/2-4);
    cx.fillStyle=e.dark;rr(e.x-e.w/2,e.y-e.h/2+e.h*.56,e.w,e.h*.5,8);cx.fill();
    cx.fillStyle=e.col;rr(e.x-e.w/2,e.y-e.h/2,e.w,e.h,8);cx.fill();
    ico[k](e.x,e.y,Math.min(e.w,e.h)*.86);
    plate(e.x,e.y-e.h/2-9,e.n,'rgba(16,24,32,.93)','#F2F7FA',15);
    if(k==='defib'&&G.df.charged)plate(e.x,e.y+e.h/2+22,'已充電 '+G.df.j+'J','rgba(196,60,70,.96)','#fff',12);}

  for(const c of CH){
    if(c.hold==='paddle'||c.hold==='probe'){
      const k=c.hold==='paddle'?'defib':'echo',e=G.eq[k];
      const ok=Math.hypot(c.x-e.x,c.y-e.y)<=e.cable;
      cx.strokeStyle=ok?'rgba(70,90,105,.7)':'rgba(224,85,95,.92)';
      cx.lineWidth=3;cx.setLineDash(ok?[]:[6,5]);cx.beginPath();
      cx.moveTo(e.x,e.y);cx.quadraticCurveTo((e.x+c.x)/2,Math.max(e.y,c.y)+34,c.x,c.y-14);

const MON={};
function mkMon(id,col,win,sr,base,amp){
  const el=$(id);
  MON[id]={el,x:el.getContext('2d'),col,win,sr,base,amp,
    n:Math.round(win*sr),buf:new Float32Array(Math.round(win*sr)),head:0,t:0,r:null,rc:99};
}
mkMon('cEcg','#25E06B',4.0,140,.50,.40);
mkMon('cCo2','#F5C542',9.0,40,.94,.90);
function pushMon(dt){
  if(!G)return;
  for(const id in MON){const o=MON[id];
    let n=Math.min(o.sr*0.2,Math.round(dt*o.sr));if(n<1&&Math.random()<dt*o.sr)n=1;
    for(let i=0;i<n;i++){o.t+=1/o.sr;
      o.buf[o.head]=id==='cEcg'?IHCA.ecgAt(G,o.t,false):IHCA.co2At(G,o.t);
      o.head=(o.head+1)%o.n;}}
}
function drawMon(){
  for(const id in MON){const o=MON[id],dpr=devicePixelRatio||1;
    if(!o.r||++o.rc>40){o.r=o.el.getBoundingClientRect();o.rc=0;}
    const r=o.r;if(!r.width)continue;
    if(o.el.width!==Math.round(r.width*dpr)){o.el.width=Math.round(r.width*dpr);o.el.height=Math.round(r.height*dpr);}
    const x=o.x,w=r.width,h=r.height;
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    x.strokeStyle='rgba(60,80,70,.28)';x.lineWidth=1;
    for(let gx=0;gx<w;gx+=Math.max(12,w/8)){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,h);x.stroke();}
    x.beginPath();x.moveTo(0,h*o.base);x.lineTo(w,h*o.base);x.stroke();
    const unlead=(id==='cEcg'&&G&&!G.leads);
    x.strokeStyle=o.col;x.lineWidth=1.9;x.lineJoin='round';x.lineCap='round';
    /* 還沒貼上監測貼片 —— 畫虛線平線，跟真正的 asystole（實線）區分開來 */
    if(unlead)x.setLineDash([7,6]); else x.setLineDash([]);
    x.beginPath();
    const base=h*o.base,amp=h*o.amp;
    for(let i=0;i<o.n;i++){const v=o.buf[(o.head+i)%o.n];
      const pxx=i*(w/(o.n-1)),pyy=base-v*amp;i?x.lineTo(pxx,pyy):x.moveTo(pxx,pyy);}
    x.stroke();x.setLineDash([]);
    x.fillStyle='rgba(255,255,255,.35)';x.fillRect(w-2,0,2,h);}
}

const STRIP={n:900,win:6,buf:new Float32Array(900),head:0,t:0,el:null,x:null,last:0};
STRIP.el=$('cStrip');STRIP.x=STRIP.el.getContext('2d');
function fillStrip(){const sr=STRIP.n/STRIP.win;
  for(let i=0;i<STRIP.n;i++)STRIP.buf[i]=IHCA.ecgAt(G,STRIP.t-(STRIP.n-1-i)/sr,true);
  STRIP.head=0;}
function pushStrip(dt){
  if(!G||G.check<=0)return;
  if(STRIP.last<=0)fillStrip();
  const sr=STRIP.n/STRIP.win;
  const n=Math.min(sr*0.2,Math.round(dt*sr));
  for(let i=0;i<n;i++){STRIP.t+=1/sr;STRIP.buf[STRIP.head]=IHCA.ecgAt(G,STRIP.t,true);
    STRIP.head=(STRIP.head+1)%STRIP.n;}
}
function drawStrip(){
  const el=STRIP.el,dpr=devicePixelRatio||1,r=el.getBoundingClientRect();if(!r.width)return;
  if(el.width!==Math.round(r.width*dpr)){el.width=Math.round(r.width*dpr);el.height=Math.round(r.height*dpr);}
  const x=STRIP.x,w=r.width,h=r.height;
  x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle='#050B0A';x.fillRect(0,0,w,h);
  const pps=w/STRIP.win, sm=pps*0.04;
  x.strokeStyle='rgba(70,140,110,.14)';x.lineWidth=1;
  for(let gx=0;gx<w;gx+=sm){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,h);x.stroke();}
  for(let gy=0;gy<h;gy+=sm){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke();}
  x.strokeStyle='rgba(70,160,120,.30)';
  for(let gx=0;gx<w;gx+=sm*5){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,h);x.stroke();}
  for(let gy=0;gy<h;gy+=sm*5){x.beginPath();x.moveTo(0,gy);x.lineTo(w,gy);x.stroke();}
  x.strokeStyle='#39F58C';x.lineWidth=2.1;x.lineJoin='round';x.beginPath();
  for(let i=0;i<STRIP.n;i++){const v=STRIP.buf[(STRIP.head+i)%STRIP.n];
    const pxx=i*(w/(STRIP.n-1)),pyy=h*.52-v*h*.45;i?x.lineTo(pxx,pyy):x.moveTo(pxx,pyy);}
  x.stroke();
  x.fillStyle='rgba(150,200,180,.5)';x.font='10px ui-monospace,monospace';x.textAlign='left';
  for(let s=1;s<STRIP.win;s++)x.fillText(s+'s',s*pps+2,h-3);
}

let _keys=[];
function setActs(list){
  const P=$('acts');
  const keyOf=x=>x.t==='btn'?('b:'+x.k):('h:'+x.k);
  const keys=list.map(keyOf);
  const same=keys.length===_keys.length&&keys.every((k,i)=>k===_keys[i]);
  if(same){const kids=P.children;
    for(let i=0;i<list.length;i++){const it=list[i],el=kids[i];if(!el)break;
      if(it.t==='btn'){if(el.innerHTML!==it.label)el.innerHTML=it.label;
        const cls=it.cls||'';if(el.className!==cls)el.className=cls;el.disabled=!!it.dis;}
      else{if(el.className!==(it.cls||''))el.className=it.cls||'';
        if(el.innerHTML!==it.html)el.innerHTML=it.html;}}
    return;}
  _keys=keys;P.innerHTML='';
  for(const it of list){
    let el;
    if(it.t==='btn'){el=document.createElement('button');el.className=it.cls||'';
      el.innerHTML=it.label;el.disabled=!!it.dis;el.onclick=it.fn;}
    else{el=document.createElement('div');el.className=it.cls||'';el.innerHTML=it.html;}
    P.appendChild(el);}
}

/* 依 tier 排序並插入分隔標題 */
function strip3(L){
  const out=[];const names={1:'① 現在能做的處置',2:'② 溝通',3:'③ 準備與雜項'};
  for(const t of [1,2,3]){
    let g=L.filter(x=>x.tier===t);
    if(!g.length)continue;
    /* tier ① 依臨床優先序重排，不照程式碼的執行順序 */
    if(t===1)g=g.map((x,i)=>[x,i]).sort((a,b)=>((a[0].pri||9)-(b[0].pri||9))||(a[1]-b[1]))
                .map(x=>x[0]);
    out.push({t:'html',k:'sec'+t,cls:'sec t'+t,html:names[t]+'<i></i>'});
    for(const x of g)out.push(x);}
  return out;
}
function readyList(c,k,hk){
  const R=K.READYFOR,out=[];
  if(G.roscFelt&&!G.roscKnown&&(c.recent||[]).includes('我摸到脈搏了！'))out.push('我摸到脈搏了！','病人有脈搏，停止壓胸');
  if(G.cpr===c.id)out.push.apply(out,R.cpr);
  if(k==='head')out.push.apply(out,R.head);
  if(nearEq(c)==='pc')out.push.apply(out,R.rec);
  if(hk==='drug')out.push.apply(out,R.drug);
  if(hk==='cath')out.push.apply(out,R.cath);
  if(hk==='io')out.push.apply(out,R.io);
  if(hk==='ett')out.push.apply(out,R.ett);
  if(hk==='paddle')out.push.apply(out,R.pad);
  if(hk==='probe')out.push.apply(out,R.probe);
  if(['bedL','bedR'].includes(k))out.push.apply(out,R.pulse);
  out.push.apply(out,R.any);
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}

    let b='空地',col=null;
    if(c.down>0){b='倒地 '+Math.ceil(c.down)+'s';col='#FF5566';}
    else if(G.cpr===c.id&&G.pauseVent){b='等通氣';col='#F5C542';}
    else if(G.cpr===c.id){b='壓胸 '+G.cnt;col='#FF7A59';}
    else if(c.busy){b=c.busy.l.slice(0,6)+'…';col='#3FD0E8';}
    else if(c.push){b='推'+G.eq[c.push].n;col='#9B86EE';}
    else if(c.hold){b=K.ITEM[c.hold].n.slice(0,6);col='#4CAF6E';}
    else{const k=nearSt(c),e=nearEq(c);b=k?K.ST[k].n.split(' ')[0]:(e?G.eq[e].n:'空地');}
    return '<div class="w'+(ME===c.id?' sel':'')+(G.leader===c.id?' ld':'')
      +((!c.online&&!SOLO&&!REPLAY)?' off':'')+'" data-id="'+c.id+'">'
      +(col?'<div class="d" style="background:'+col+'"></div>':'')
      +(G.leader===c.id?'<div class="cr">★</div>':'')
      +'<div class="n" style="color:'+c.c+'">'+c.n+'</div><div class="b">'+b+'</div></div>';}).join('');
  if(h!==_lastWho){_lastWho=h;const el=$('who');el.innerHTML=h;
    if(SOLO||REPLAY)[...el.children].forEach(d=>d.onclick=()=>{ME=d.dataset.id;sub=null;paint();});}
}

function downloadRec(rec){
  const blob=new Blob([JSON.stringify(rec)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='IHCA錄影_'+(rec.cause||'')+'_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ═══════════ 報表（含泳道圖） ═══════════ */
const SPANCOL={cpr:'#E8724B',job:'#3FD0E8',prep:'#3FD0E8',dx:'#9B86EE',drug:'#4CAF6E',
  air:'#46A0D8',access:'#C8D24A',push:'#7E6FD0',down:'#E0555F',fam:'#B98A5A'};
const SPANNAME={cpr:'壓胸',prep:'準備器材／抽藥',dx:'找病因（病歷·家屬·超音波）',drug:'給藥／處置',
  air:'氣道',access:'建立通路',push:'推設備',down:'倒地',fam:'被家屬拉住',job:'其他工作'};
function drawSwim(cv){
  if(!HIST)return;
  const dur=Math.max(60,HIST.tl.length?HIST.tl[HIST.tl.length-1].t:60);
  const dpr=devicePixelRatio||1,r=cv.getBoundingClientRect();
  const H=Math.max(560,Math.min(2800,dur*3.6));
  cv.style.height=H+'px';
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(H*dpr);
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width;
  x.fillStyle='#080E12';x.fillRect(0,0,W,H);
  const padL=46,padR=Math.min(190,Math.max(120,W*0.28)),padT=30,padB=16;
  const cols=HIST.perPerson.length, cw=(W-padL-padR)/cols;
  const y0=padT,y1=H-padB,sy=t=>y0+(t/dur)*(y1-y0);
  x.textAlign='center';
  HIST.perPerson.forEach((p,i)=>{
    const cxp=padL+cw*(i+.5);
    x.fillStyle=p.col;x.font='700 15px sans-serif';
    x.fillText(p.n+(p.lead?' \u2605':''),cxp,20);
    x.strokeStyle='rgba(60,80,95,.35)';x.lineWidth=1;
    x.beginPath();x.moveTo(padL+cw*i,y0-4);x.lineTo(padL+cw*i,y1);x.stroke();});
  x.beginPath();x.moveTo(padL+cw*cols,y0-4);x.lineTo(padL+cw*cols,y1);x.stroke();
  x.textAlign='right';x.font='11px ui-monospace,monospace';
  const stepS=dur>600?120:dur>300?60:30;
  for(let t=0;t<=dur;t+=stepS){const yy=sy(t);
    x.strokeStyle='rgba(70,95,110,.28)';x.beginPath();x.moveTo(padL-6,yy);x.lineTo(padL+cw*cols,yy);x.stroke();
    x.fillStyle='#6D8496';x.fillText(mmt(t),padL-10,yy+4);}
  const idx={};HIST.perPerson.forEach((p,i)=>idx[p.id]=i);
  for(const s2 of HIST.acts){
    const i=idx[s2.id];if(i===undefined)continue;
    const a=sy(s2.t0),b=Math.max(sy(s2.t1),a+2.5);
    x.fillStyle=SPANCOL[s2.kind]||'#3FD0E8';
    x.globalAlpha=s2.kind==='cpr'?.95:.82;
    const w=cw-14,rx=padL+cw*i+7,ry=a,rh=b-a,rad=Math.min(3,rh/2);
    x.beginPath();x.moveTo(rx+rad,ry);x.arcTo(rx+w,ry,rx+w,ry+rh,rad);x.arcTo(rx+w,ry+rh,rx,ry+rh,rad);
    x.arcTo(rx,ry+rh,rx,ry,rad);x.arcTo(rx,ry,rx+w,ry,rad);x.closePath();x.fill();
    x.globalAlpha=1;
    if(rh>15){x.fillStyle='rgba(6,12,16,.85)';x.font='10px sans-serif';x.textAlign='left';
      x.fillText((s2.label||'').slice(0,Math.max(2,Math.floor(w/10))),rx+4,ry+11);x.textAlign='right';}}
  /* 瞬間事件：講話、下令、放電 */
  const PC={say:'#6FC8DE',order:'#E8B84B',ack:'#7FE0A8',lead:'#E8B84B',shock:'#FF6B7E'};
  x.textAlign='left';
  for(const q of (HIST.pts||[])){
    const i=idx[q.id];if(i===undefined)continue;
    const yy=sy(q.t),cxp=padL+cw*i+7,w=cw-14;
    x.fillStyle=PC[q.kind]||'#6FC8DE';
    if(q.kind==='shock'){x.fillRect(cxp,yy-2.5,w,5);}
    else{x.beginPath();x.moveTo(cxp+6,yy-4.5);x.lineTo(cxp+12,yy);x.lineTo(cxp+6,yy+4.5);
      x.lineTo(cxp,yy);x.closePath();x.fill();
      x.fillStyle='rgba(190,215,228,.8)';x.font='9.5px sans-serif';
      x.fillText((q.label||'').slice(0,Math.max(2,Math.floor((w-16)/9))),cxp+15,yy+3.5);}}
  /* 右側關鍵事件，往下錯開避免重疊 */
  x.font='11px sans-serif';let lastY=-99;
  for(const ev of HIST.tl){
    if(ev.kind!=='key')continue;
    const yy=sy(ev.t);let ly=Math.max(yy,lastY+13);lastY=ly;
    x.strokeStyle='rgba(232,184,75,.35)';x.setLineDash([3,3]);x.lineWidth=1;
    x.beginPath();x.moveTo(padL,yy);x.lineTo(W-padR+4,yy);x.stroke();
    if(Math.abs(ly-yy)>2){x.beginPath();x.moveTo(W-padR+4,yy);x.lineTo(W-padR+10,ly-3);x.stroke();}
    x.setLineDash([]);
    x.fillStyle='#D9C489';
    const maxc=Math.max(6,Math.floor((padR-16)/11));
    const t=ev.txt.length>maxc?ev.txt.slice(0,maxc-1)+'…':ev.txt;
    x.fillText(t,W-padR+12,ly);}
}

/* ═══════════ 重播 ═══════════ */
const RP={rec:null,G:null,qi:0,end:0,playing:false,speed:2,eye:'a',ready:false};
function rpLoad(rec){
  /* 引擎版本檢查：重播是「同樣的種子＋同樣的操作序列重算一次」，
     只要模擬邏輯改過，舊檔重播出來就是另一局。寧可拒播，也不要靜默播錯。 */
  const need=IHCA.ENGINE, got=rec.engine||null;
  if(got!==need){
    const msg=got
      ? '這個錄影檔是引擎 '+got+' 產生的，本版是 '+need+'。\n'
        +'模擬邏輯改過之後重播會算出不一樣的一局，所以不能播。'
      : '這個錄影檔沒有引擎版本標記（v3.2 以前），本版是 '+need+'。\n'
        +'舊檔只能當歷史文件，不能重播，也不要與新資料合併分析。';
    alert(msg);
    return false;
  }
  RP.rec=rec;RP.eye='a';
  /* 先整場跑一次，找出結束的 tick */
  const probe=IHCA.newState(rec.seed,rec.setup);
  let qi=0;
  for(let i=0;i<IHCA.HZ*1000;i++){
    while(qi<rec.events.length&&rec.events[qi].k<=probe.tick){
      const e=rec.events[qi++];IHCA.applyAct(probe,e.c,e.a,e.p);}
    IHCA.use(probe);IHCA.step();
    if(probe.over)break;}
  RP.end=probe.tick;
  RP.finalG=probe;
  HIST=IHCA.history(probe);
  rpReset();RP.ready=true;
  $('rpSeek').max=RP.end;
  paintReplayBar();
  return true;
}

function rpReset(){
  RP.G=IHCA.newState(RP.rec.seed,RP.rec.setup);RP.qi=0;G=RP.G;
  for(const id in MON){MON[id].buf.fill(0);}
}
function rpSeek(tick){
  if(tick<RP.G.tick)rpReset();
  let guard=0;
  while(RP.G.tick<tick&&guard++<IHCA.HZ*1200){
    while(RP.qi<RP.rec.events.length&&RP.rec.events[RP.qi].k<=RP.G.tick){
      const e=RP.rec.events[RP.qi++];IHCA.applyAct(RP.G,e.c,e.a,e.p);}
    IHCA.use(RP.G);IHCA.step();
    RP.G.outbox.length=0;
  }
  G=RP.G;
}
function rpAdvance(n){
  for(let i=0;i<n;i++){
    if(RP.G.tick>=RP.end){RP.playing=false;break;}
    while(RP.qi<RP.rec.events.length&&RP.rec.events[RP.qi].k<=RP.G.tick){
      const e=RP.rec.events[RP.qi++];IHCA.applyAct(RP.G,e.c,e.a,e.p);}
    IHCA.use(RP.G);IHCA.step();
    if(RP.G.outbox.length){
      for(const o of RP.G.outbox)if(!o.who||o.who===RP.eye)toast(o.m,!!o.who);
      RP.G.outbox.length=0;}
  }
  G=RP.G;
}

/* ═══ 浮動搖桿：按住病房畫面任何位置拖曳就能走；輕點＝走到那個站位 ═══ */
const stk=$('stick'),knob=$('knob');
let jId=null,jSt=null,jMoved=false,jT0=0,_jt=0;
const JR=52;
function toWorld(e){const r=cv.getBoundingClientRect(),sc=Math.min(r.width/K.W,r.height/K.H);
  return{x:((e.clientX-r.left)-(r.width-K.W*sc)/2)/sc,y:((e.clientY-r.top)-(r.height-K.H*sc)/2)/sc,r};}
function showStick(cx0,cy0){const r=cv.getBoundingClientRect();
  stk.style.left=(cx0-r.left)+'px';stk.style.top=(cy0-r.top)+'px';
  knob.style.left='41px';knob.style.top='41px';stk.classList.add('on');}
function moveKnob(dx,dy){knob.style.left=(41+dx)+'px';knob.style.top=(41+dy)+'px';}
function hideStick(){stk.classList.remove('on');}
cv.addEventListener('pointerdown',e=>{
  if(!G||REPLAY||MODE==='host'||MODE==='teacher')return;
  ac();
  if(!meC())return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  jId=e.pointerId;jSt={x:e.clientX,y:e.clientY};jMoved=false;jT0=performance.now();_jt=0;
  showStick(e.clientX,e.clientY);
  e.preventDefault();
},{passive:false});
let _jlx=0,_jly=0;
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==jId||!jSt)return;
  let dx=e.clientX-jSt.x,dy=e.clientY-jSt.y,d=Math.hypot(dx,dy);
  if(d>12)jMoved=true;
  if(d>JR){dx=dx/d*JR;dy=dy/d*JR;d=JR;}
  moveKnob(dx,dy);
  if(!jMoved)return;
  const nx=dx/JR,ny=dy/JR;
  PRED.vx=nx;PRED.vy=ny;                      /* 本機立刻動 */
  const now=performance.now();
  if(_jt===0||(Math.hypot(nx-_jlx,ny-_jly)>0.15&&now-_jt>70)){
    _jt=now;_jlx=nx;_jly=ny;
    NET.act('move',{dx:Math.round(nx*100)/100,dy:Math.round(ny*100)/100});}
  e.preventDefault();
},{passive:false});
function endStick(e){
  if(e.pointerId!==jId)return;
  hideStick();PRED.vx=PRED.vy=0;_jlx=_jly=0;
  const quick=performance.now()-jT0<400;
  if(!jMoved&&quick){                       /* 輕點 = 走過去 */
    const w=toWorld(e);
    if(SOLO){for(const c of G.ch)if(c.active!==false&&Math.hypot(w.x-c.x,w.y-(c.y-22))<38){ME=c.id;sub=null;jId=null;jSt=null;paint();return;}}
    let best=null,bd=1e9;
    for(const k in K.ST){const st2=K.ST[k];
      if(Math.abs(w.x-st2.x)<st2.w/2+40&&Math.abs(w.y-st2.y)<st2.h/2+40){
        const d2=Math.hypot(w.x-st2.x,w.y-st2.y);if(d2<bd){bd=d2;best={t:'s',k};}}}
    for(const k in G.eq){const q=G.eq[k];
      if(Math.abs(w.x-q.x)<q.w/2+40&&Math.abs(w.y-q.y)<q.h/2+46){
        const d2=Math.hypot(w.x-q.x,w.y-q.y);if(d2<bd){bd=d2;best={t:'e',k};}}}
    PRED.vx=PRED.vy=0;
    if(best)NET.act('goto',{k:best.k});
    else NET.act('gotoXY',{x:w.x,y:w.y});
  }else NET.act('stop');
  jId=null;jSt=null;paint();
}
cv.addEventListener('pointerup',endStick);
cv.addEventListener('pointercancel',e=>{hideStick();PRED.vx=PRED.vy=0;

/* 音效 */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,ty,v,sl){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';
 o.frequency.setValueAtTime(f,a.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(sl,a.currentTime+d);
 g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(v||.12,a.currentTime+.008);
 g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);
 o.start();o.stop(a.currentTime+d+.05);}catch(e){}}
function noiz(d,v){try{const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
 for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s2=a.createBufferSource(),g=a.createGain();
 s2.buffer=b;g.gain.value=v||.2;s2.connect(g);g.connect(a.destination);s2.start();}catch(e){}}
const SFX={tick:()=>tone(1180,.035,'square',.05),t30:()=>tone(1520,.1,'square',.11),
 chg:()=>tone(430,2.9,'sawtooth',.075,1750),ok:()=>{tone(720,.09,'sine',.1);setTimeout(()=>tone(1080,.12,'sine',.1),80);},
 zap:()=>{noiz(.22,.3);tone(80,.28,'square',.16);},breath:()=>tone(340,.28,'sine',.07,220),
 alarm:()=>{tone(880,.1,'square',.08);setTimeout(()=>tone(880,.1,'square',.08),160);},
 rosc:()=>{[660,880,1170].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.11),i*110));},
 bcast:()=>{tone(600,.08,'sine',.09);setTimeout(()=>tone(900,.1,'sine',.09),80);setTimeout(()=>tone(1200,.12,'sine',.09),170);}};
let W_={cnt:0,shocks:0,check:0,charged:false,chgT:0,down:0,air:'BVM',order:null,rosc:false,clues:0};
function sfxWatch(){
  if(!G||MODE==='teacher'||REPLAY)return;
  if(G.cnt!==W_.cnt){if(G.cnt>W_.cnt)SFX.tick();W_.cnt=G.cnt;}
  if(G.needPause&&!W_.need)SFX.t30(); W_.need=G.needPause;
  if(G.shocks>W_.shocks){SFX.zap();W_.shocks=G.shocks;}
  /* 充電中的爬升音 —— SFX.chg 一直是定義了但沒人呼叫的死碼 */
  if(G.df.chargeT>0&&!(W_.chgT>0))SFX.chg(); W_.chgT=G.df.chargeT;
  if(G.df.charged&&!W_.charged)SFX.ok(); W_.charged=G.df.charged;
  if(G.check>0&&W_.check<=0)SFX.alarm(); W_.check=G.check;
  if(G.clues.length>W_.clues){SFX.ok();W_.clues=G.clues.length;}
  if(G.air!==W_.air){G.air==='ETT'?SFX.ok():SFX.alarm();W_.air=G.air;}
  if(G.rosc&&!W_.rosc)SFX.rosc(); W_.rosc=G.rosc;
  const d=G.ch.filter(c=>c.down>0).length; if(d>W_.down)SFX.alarm(); W_.down=d;
  const ot=G.order?G.order.txt+G.order.at:null;
  if(ot&&ot!==W_.order)SFX.bcast(); W_.order=ot;
  if(G.pauseVent&&G.breaths>0&&G.breaths!==W_.br)SFX.breath(); W_.br=G.breaths;
}

    const mine=G.order.by===ME,done=G.order.ack.includes(ME);
    $('ordb').style.display=(mine||MODE==='host'||REPLAY)?'none':'';
    $('ordb').textContent=done?'已複誦':'收到';$('ordb').disabled=done;}
  else o.classList.remove('on');
  const fitems=[...G.feed].reverse().map(f=>
    '<div class="f'+(f.big?' big':'')+'" data-k="'+f.at+f.n+'"><b style="color:'+f.col+'">'
    +f.n+'</b>'+f.txt+'</div>');
  const fh=fitems.join('');
  /* 直立手機的那一條只留最新兩則。
     不要靠 max-height + overflow 裁 —— 反向 flex 容器溢位時，瀏覽器裁掉的是新的那一端，
     結果會變成舊訊息留在畫面上、新訊息永遠看不到。 */
  const fhp=fitems.slice(0,2).join('');
  if(fh!==_lastFeedH){
    const seen=new Set([...$('feed').children].map(x=>x.dataset.k));
    _lastFeedH=fh;
    for(const [id,html] of [['feed',fh],['feedp',fhp]]){
      const el=$(id); if(!el)continue;
      el.innerHTML=html;
      [...el.children].forEach(x=>{if(!seen.has(x.dataset.k))x.classList.add('new');});}}
  if(MODE==='player'||SOLO){paintYouAre();buildPanel();}
  if(G.over&&(SOLO||REPLAY)&&!HIST){HIST=IHCA.history(SOLO?LOCAL:RP.finalG);renderSheet();}
  if(G.over&&!SOLO&&!REPLAY&&!HIST&&!_askedHist){_askedHist=1;NET.send({t:'history'});}
}

/* ═══════════ 主迴圈 ═══════════ */
let last=0,acc=0,accSim=0;
function loop(ts){
  const dt0=Math.min(.06,(ts-last)/1000||0);last=ts;
  if(SOLO&&LOCAL&&!LOCAL.over&&!LOCAL.paused){
    accSim+=dt0*speed;
    let n=0;while(accSim>=IHCA.DT&&n<20){IHCA.use(LOCAL);IHCA.step();accSim-=IHCA.DT;n++;}
    if(LOCAL.outbox.length){for(const e of LOCAL.outbox)if(!e.who||e.who===ME)toast(e.m,!!e.who);
      LOCAL.outbox.length=0;}
    G=LOCAL;
  }
  if(REPLAY&&RP.ready&&RP.playing){
    accSim+=dt0*RP.speed;
    let n=0;while(accSim>=IHCA.DT&&n<60){rpAdvance(1);accSim-=IHCA.DT;n++;}
  }
  if(G){
    const meC0=meC();
    if(meC0&&(meC0.busy||meC0.down>0))PRED.vx=PRED.vy=0;
    pushMon(dt0*(SOLO?speed:(REPLAY&&RP.playing?RP.speed:1)));
    pushStrip(dt0);
    sfxWatch();
    drawWard(cx,cv,ME);
    drawMon();paintMonNums();paintStrip();paintRecs();
    const meNow=meC();
    const atRec=meNow?nearEq(meNow)==='pc':false;
    const showT=(MODE==='host'||MODE==='teacher'||REPLAY)?true:atRec;
    $('clk').textContent=showT?mmt(G.t):'‑‑:‑‑';
    $('sub').textContent=showT
      ? (G.check>0?('第 '+G.round+' 次心律檢查中'):('距上次檢查 '+mmt(G.sinceCheck)))
      : ((meNow?meNow.n:'你')+' 看不到急救時間 — 要到電腦車前面');
  }
  if(G&&!G.paused&&!G.over&&G.phase!=='lobby')ANIM+=dt0;
  if(toastT>0){toastT-=dt0;if(toastT<=0)$('toast').classList.remove('on');}
  if(MODE==='teacher'&&G){const el=$('tcClock');
    if(el){const txt=mmt(G.t)+(G.check>0?'　心律檢查中':'')+(G.paused?'　⏸ 已暫停':'');
      if(el.textContent!==txt)el.textContent=txt;}}
  acc+=dt0;if(acc>.1){acc=0;paint();if(REPLAY)paintReplayBar();}
  requestAnimationFrame(loop);
}
function afterSnap(){ if(MODE==='player')paintGate(); }

/* ═══════════ 啟動 ═══════════ */
if(REPLAY){setupReplayUI();replayGate();}
else if(SOLO){
  soloNew({});ME='a';
  $('gate').classList.add('on');
  $('gate').innerHTML='<div class="inner"><h1>單機測試版</h1>'
   +'<p>一台裝置操作六個人，用來測試流程。下面選好情境按開始。'
   +'多人版請在筆電上跑 <code>node server.js</code>。</p>'
   +'<div class="lab">這一場有幾個人</div><div class="g" id="sN"></div>'
   +'<div class="lab">病人身上有沒有點滴</div><div class="g" id="sD"></div>'
   +'<div class="lab">一開始的心律</div><div class="g" id="sR"></div>'
   +'<div class="lab">真正的病因</div><div class="g" id="sC"></div>'
   +'<div style="margin-top:22px"><button class="go" style="width:100%;min-height:58px;font-size:16px" id="sGo">開始</button></div></div>';
  const st={drip:'none',rhythm:'rand',cause:'rand',n:6};
  const mk=(box,items,key)=>{const el=$(box);el.style.display='grid';
    el.style.gridTemplateColumns='1fr 1fr';el.style.gap='8px';
    el.innerHTML='';for(const it of items){const b=document.createElement('button');
      b.style.minHeight='54px';b.innerHTML=it.n;b.className=st[key]===it.id?'on':'';
      b.style.borderColor=st[key]===it.id?'#3FD0E8':'';
      b.onclick=()=>{st[key]=it.id;mk(box,items,key);};el.appendChild(b);}};
  mk('sN',[3,4,5,6].map(k=>({id:k,n:k+' 人'})),'n');
  mk('sD',K.DRIPS,'drip');
  mk('sR',[{id:'rand',n:'隨機'}].concat(K.STARTRHY.map(id=>({id,n:RH(id).n}))),'rhythm');
  mk('sC',[{id:'rand',n:'隨機（學員猜）'}].concat(K.CAUSES.map(c=>({id:c.id,n:c.n}))),'cause');
  $('sGo').onclick=()=>{ac();soloNew(st);soloCtl('__start');$('gate').classList.remove('on');paint();};
}
else{NET.connect();}
requestAnimationFrame(loop);
</script>
